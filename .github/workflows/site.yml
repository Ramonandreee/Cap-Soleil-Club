# Site (Astro): tipos, testes, build e testes de ponta a ponta com a CSP de produção.
# Roda em todo PR e em todo push na main. A verificação "Documentação em dia"
# fica no seu próprio workflow (docs.yml).
name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Site (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos (astro check)
        run: npm run check

      - name: Testes de unidade (validação, relógio de sol, função apply, cabeçalhos)
        run: npm test

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://capsoleilclub.com

      - name: Navegador dos testes
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta (desktop e celular)
        run: npm run test:e2e

      - name: Relatório dos testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
